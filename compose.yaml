name: operai-eye

services:
  triton:
    image: nvcr.io/nvidia/tritonserver:${TRITON_IMAGE_TAG:-26.06-py3}
    command:
      - tritonserver
      - --model-repository=/models
      - --strict-model-config=true
      - --log-info=true
      - --exit-on-error=true
    init: true
    shm_size: 256mb
    volumes:
      - type: bind
        source: ./deploy/triton/model_repository
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OPERAI_MODEL_PATH:-./models/operai_eye_dinov3.int8.onnx}
        target: /models/operai_eye_dinov3/1/model.onnx
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8000"
      - "8001"
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/v2/models/operai_eye_dinov3/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    restart: unless-stopped
    stop_grace_period: 30s

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    environment:
      OPERAI_CONFIG_PATH: /app/config.toml
      TRITON_URL: http://triton:8000
      TRITON_MODEL_NAME: operai_eye_dinov3
      TRITON_TIMEOUT_SECONDS: ${TRITON_TIMEOUT_SECONDS:-120}
    volumes:
      - operai-state:/data
    expose:
      - "8000"
    depends_on:
      triton:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    ports:
      - "${OPERAI_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 5s
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    restart: unless-stopped

volumes:
  operai-state:
