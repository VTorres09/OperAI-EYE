name: operai-eye

services:
  app:
    build:
      context: .
      dockerfile: deploy/docker/app.Dockerfile
    ports:
      - "${OPERAI_PORT:-8080}:8000"
    volumes:
      - type: bind
        source: ${OPERAI_MODEL_PATH:-./models/operai_eye_dinov3.onnx}
        target: /models/operai_eye_dinov3/model.onnx
        read_only: true
        bind:
          create_host_path: false
      - operai-state:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 6
      start_period: 60s
    init: true
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  operai-state:
