[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "operai-eye"
version = "0.1.0"
description = "Local operating-room scene classification and monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.12.0",
    "huggingface_hub>=0.30.0",
    "numpy>=2.0.0",
    "pillow>=10.4.0,<11.0.0",
    "tqdm>=4.67.0",
    "openai>=1.0.0",
    "transformers>=4.51.1,<5.0.0",
    "torch>=2.7.0",
    "accelerate>=1.10.0",
    "einops>=0.7.0",
    "pyvips>=2.2.0",
    "pandas>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-dotenv>=1.2.2",
    "datasets>=4.0.0",
    "moondream>=1.3.0",
]

[project.optional-dependencies]
edge = [
    "onnxruntime>=1.20.0,<2.0.0",
    "opencv-python-headless>=4.10.0.84,<5.0.0",
]

[project.scripts]
operai-edge = "operai_eye.edge.cli:main"
operai-export-model = "operai_eye.edge.export_model:main"
operai-web = "operai_eye.web.run:main"
operai-download-data = "operai_eye.pipeline.download_exocentric_rgb:main"
operai-label-data = "operai_eye.pipeline.label_data:main"
operai-audit-labels = "operai_eye.pipeline.audit_labels:main"
operai-prepare-hf = "operai_eye.pipeline.prepare_hf_dataset:main"
operai-prepare-sft = "operai_eye.pipeline.prepare_sft_dataset:main"
operai-evaluate-moondream = "operai_eye.pipeline.evaluate_moondream:main"
operai-register-eval = "operai_eye.pipeline.register_eval:main"
operai-train-dinov3 = "operai_eye.training.dinov3.train_lightly:main"
operai-evaluate-dinov3 = "operai_eye.training.dinov3.evaluate_lightly:main"
operai-train-moondream = "operai_eye.training.moondream.finetune_moondream:main"
operai-evaluate-moondream-sft = "operai_eye.training.moondream.evaluate_finetune:main"

[tool.setuptools.packages.find]
include = ["operai_eye*"]

[tool.setuptools.package-data]
"operai_eye.edge" = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
