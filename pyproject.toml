[project]
name = "operai-eye"
version = "0.1.0"
description = "EgoExOR model evaluation on MISS exocentric RGB frames"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate==0.21.0",
    "bitsandbytes>=0.49.2",
    "diffusers==0.25.0",
    "h5py>=3.16.0",
    "huggingface-hub>=0.36.2",
    "json-tricks>=3.17.3",
    "opencv-python-headless>=4.13.0.92",
    "peft==0.4.0",
    "pytorch-lightning==2.1.2",
    "scikit-learn>=1.7.2",
    "sentencepiece>=0.2.1",
    "timm==0.6.13",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "transformers==4.31.0",
    "wandb>=0.26.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
