[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "operai-eye"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.12.0",
    "huggingface_hub>=0.30.0",
    "numpy>=2.0.0",
    "pillow>=10.4.0,<11.0.0",
    "tqdm>=4.67.0",
    "openai>=1.0.0",
    "transformers>=4.51.1,<5.0.0",
    "torch>=2.7.0",
    "accelerate>=1.10.0",
    "einops>=0.7.0",
    "pyvips>=2.2.0",
    "pandas>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-dotenv>=1.2.2",
    "datasets>=4.0.0",
    "moondream>=1.3.0",
]

[project.optional-dependencies]
edge = [
    "onnxruntime>=1.20.0,<2.0.0",
    "opencv-python-headless>=4.10.0.84,<5.0.0",
]

[project.scripts]
operai-edge = "edge_app.cli:main"

[tool.setuptools.packages.find]
include = ["edge_app*"]

[tool.setuptools.package-data]
edge_app = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
